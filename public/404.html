<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Bandwidth Atlas</title>
    <meta
      name="description"
      content="This page does not exist. Return to the PCIe Speed Explorer."
    />
    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0f1e;
        color: #e8edf7;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        border: 1px solid #223052;
        border-radius: 12px;
        padding: 48px 40px;
        background: #101830;
        max-width: 520px;
      }
      .code {
        font-size: 64px;
        font-weight: 700;
        letter-spacing: 0.06em;
        margin: 0;
        color: #22d3ee;
      }
      p {
        color: #9aa7c7;
        line-height: 1.6;
      }
      a {
        color: #22d3ee;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="code">404</p>
      <h1 style="margin: 8px 0 16px; font-size: 22px">This lane doesn't exist</h1>
      <p>
        The page you requested is not part of Bandwidth Atlas.
        <br />
        <a id="home" href="/">Go to the PCIe Speed Explorer</a>
      </p>
    </div>
    <script>
      // Compute the site root relative to the requested path so links and
      // the favicon work on both project sites (/<owner>/<repo>/) and
      // user sites (//).
      var root = location.pathname.replace(/\/[^/]*$/, '/') || '/';
      document.getElementById('home').setAttribute('href', root);
      document.getElementById('favicon').setAttribute('href', root + 'favicon.svg');
    </script>
  </body>
</html>
